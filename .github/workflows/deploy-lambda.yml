name: Deploy changed Lambda files

on:
  push:
    branches:
      - main
    paths:
      - "lambdas/*.py"
      - ".github/workflows/deploy-lambda.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  LAMBDA_EXECUTION_ROLE_ARN: arn:aws:iam::145292399647:role/flowbridge-sbx-lambda-execution-role
  LAMBDA_RUNTIME: python3.12
  LAMBDA_HANDLER: lambda_function.lambda_handler
  LAMBDA_MEMORY_SIZE: 256
  LAMBDA_TIMEOUT: 30

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::145292399647:role/github-actions-lambda-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Find changed Lambda files
        id: changed
        shell: bash
        run: |
          changed_files=$(git diff --name-only HEAD~1 HEAD -- 'lambdas/*.py' || true)

          echo "Changed files:"
          echo "$changed_files"

          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$changed_files" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Deploy changed Lambda files
        shell: bash
        run: |
          set -e

          changed_files="${{ steps.changed.outputs.files }}"

          if [ -z "$changed_files" ]; then
            echo "No changed Lambda files found."
            exit 0
          fi

          for lambda_file in $changed_files; do
            function_name=$(basename "$lambda_file" .py)

            echo "----------------------------------------"
            echo "Deploying Lambda: $function_name"
            echo "Source file: $lambda_file"

            if [ ! -s "$lambda_file" ]; then
              echo "ERROR: $lambda_file is empty."
              exit 1
            fi

            if ! grep -q "def lambda_handler" "$lambda_file"; then
              echo "ERROR: lambda_handler not found in $lambda_file."
              exit 1
            fi

            rm -rf build
            mkdir -p build

            cp "$lambda_file" build/lambda_function.py

            cd build
            zip -r "../${function_name}.zip" .
            cd ..

            if aws lambda get-function --function-name "$function_name" --region "$AWS_REGION" > /dev/null 2>&1; then
              echo "Lambda exists. Updating code: $function_name"

              aws lambda update-function-code \
                --function-name "$function_name" \
                --zip-file "fileb://${function_name}.zip" \
                --region "$AWS_REGION"

            else
              echo "Lambda does not exist. Creating function: $function_name"

              aws lambda create-function \
                --function-name "$function_name" \
                --runtime "$LAMBDA_RUNTIME" \
                --role "$LAMBDA_EXECUTION_ROLE_ARN" \
                --handler "$LAMBDA_HANDLER" \
                --zip-file "fileb://${function_name}.zip" \
                --memory-size "$LAMBDA_MEMORY_SIZE" \
                --timeout "$LAMBDA_TIMEOUT" \
                --region "$AWS_REGION" \
                --tags Project=flowbridge,Environment=sbx,ManagedBy=github-actions
            fi

            echo "Completed: $function_name"
          done